---
version: '2.1'
services:
  awx_1:
    links:
      - keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: tools_keycloak_1
    env_file:
      - '../keycloak.env'
    ports:
      - 8081:8080
    depends_on:
      - kcpostgres
      - ldap
  ldap:
    image: "rroemhild/test-openldap"
    ports:
      - "10389:10389"
      - "10636:10636"
  kcpostgres:
    image: "postgres:12"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
volumes:
  postgres_data:
    name: postgres_data_awx
  


    
    
