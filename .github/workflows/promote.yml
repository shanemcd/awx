---
name: Promote Release
on:
  release:
    types: [published]

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout awx
        uses: actions/checkout@v2

      - name: Get python version from Makefile
        run: echo py_version=`make PYTHON_VERSION` >> $GITHUB_ENV

      - name: Install python ${{ env.py_version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.py_version }}

      - name: Set official collection namespace
        run: echo collection_namespace=awx >> $GITHUB_ENV
        if: ${{ github.repository_owner == 'ansible' }}

      - name: Set unofficial collection namespace
        run: echo collection_namespace=${{ github.repository_owner }} >> $GITHUB_ENV
        if: ${{ github.repository_owner != 'ansible' }}

      - name: Build collection and publish to galaxy
        run: |
          mkdir -p /tmp/collection-build/
          ansible-playbook awx_collection/tools/template_galaxy.yml \
             -e collection_version_override=$(make print-COLLECTION_VERSION) \
             -e collection_namespace=${{ env.collection_namespace }} -v
          ansible-galaxy collection build awx_collection_build --output-path=/tmp/collection-build/ --force -v
          ansible-galaxy collection publish --token=${{ secrets.GALAXY_TOKEN }} /tmp/collection-build/*.tar.gz


